# =============================================================================
# Deploy del sito YET su GitHub Pages.
#
# PRIMA CHE QUESTO FUNZIONI, DUE COSE DA FARE UNA VOLTA SOLA SU GITHUB.
# Senza, l'action fallisce e il messaggio d'errore non dice quale delle due
# manca — quindi tienile a mente:
#
#   1. Settings -> Pages -> Source: scegli "GitHub Actions".
#      (NON "Deploy from a branch": con quella impostazione questo workflow
#      builda, carica l'artefatto e poi il deploy viene rifiutato.)
#
#   2. Settings -> Secrets and variables -> Actions -> "New repository secret",
#      e crea questi sei, con gli stessi valori che hai in .env:
#
#         VITE_FIREBASE_API_KEY
#         VITE_FIREBASE_AUTH_DOMAIN
#         VITE_FIREBASE_PROJECT_ID
#         VITE_FIREBASE_STORAGE_BUCKET
#         VITE_FIREBASE_MESSAGING_SENDER_ID
#         VITE_FIREBASE_APP_ID
#
#      (VITE_FIREBASE_MEASUREMENT_ID è opzionale: se non lo crei, il build
#      procede lo stesso.)
#
# E una terza, sul lato Firebase, che si scopre sempre troppo tardi:
# Authentication -> Settings -> Authorized domains -> aggiungi
# yetcommunity.it. Senza, il login con Google funziona in locale e
# fallisce in produzione con "auth/unauthorized-domain".
#
# -----------------------------------------------------------------------------
# STATO DI QUESTO REPO (DoubleF35/yet), aggiornato a settembre 2026:
#   [x] Pages impostato su "GitHub Actions"
#   [x] i sette secret creati
#   [ ] yetcommunity.it fra i Domini autorizzati di Firebase
#   [ ] firestore.rules pubblicate (il database è in modalità di produzione,
#       quindi finché non lo fai ogni lettura e scrittura viene negata)
# =============================================================================

name: Deploy su GitHub Pages

on:
  push:
    branches: [main]
  # Permette di lanciare il deploy a mano dalla scheda Actions: utile dopo aver
  # cambiato un secret, che da solo non fa ripartire niente.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write # richiesto da deploy-pages, che usa OIDC invece di un token

# Un deploy alla volta. cancel-in-progress: false e NON true: interrompere una
# pubblicazione a metà può lasciare il sito in uno stato incoerente, e aspettare
# trenta secondi costa meno che indagare su una pagina rotta.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Sfrutta package-lock.json per non riscaricare tutto ogni volta.
          cache: npm

      - name: Configura Pages
        uses: actions/configure-pages@v5

      # npm ci e non npm install: installa esattamente le versioni del
      # lockfile. `install` potrebbe aggiornare una dipendenza minore e far
      # fallire un build che in locale passava.
      - name: Installa
        run: npm ci

      # Prima del build: se una chiave esiste in una lingua e non nell'altra, il
      # deploy si ferma qui. Il build non se ne accorgerebbe (una traduzione
      # mancante non e' un errore di compilazione: `t()` ripiega sull'italiano)
      # e la riga italiana in mezzo alla pagina inglese finirebbe in
      # produzione, dove la trova un utente invece di noi.
      - name: Controlla le traduzioni
        run: node scripts/i18n-check.mjs

      - name: Build
        env:
          # Impostato a '/' per servire le risorse correttamente dal dominio radice custom (yetcommunity.it)
          VITE_BASE: /

          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
        run: npm run build

      # Avviso utile invece di un deploy silenziosamente rotto: se i secret non
      # ci sono, il sito si pubblica lo stesso ma senza login e senza notizie.
      # Meglio trovarselo scritto nel log che scoprirlo dal sito.
      #
      # Il secret passa da `env` e il confronto avviene dentro lo script,
      # invece che in un `if: ${{ secrets… }}`: così la condizione non dipende
      # da quali contesti GitHub ammette negli `if`, che è una regola che è già
      # cambiata in passato.
      - name: Controlla che i secret ci siano
        env:
          API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "::warning::VITE_FIREBASE_API_KEY non è impostato fra i secret."
            echo "::warning::Il sito verrà pubblicato senza Firebase: niente login e niente notizie."
            echo "::warning::Aggiungili in Settings -> Secrets and variables -> Actions."
          else
            echo "Secret Firebase presenti."
          fi

      - name: Carica l'artefatto
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
