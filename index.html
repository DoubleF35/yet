    <!--
      Inter NON arriva da Google Fonts.

      È una scelta di privacy, non di prestazioni: chiedere il font al CDN di
      Google significa che il browser di ogni visitatore apre una connessione
      verso un server di Google e gli consegna il proprio indirizzo IP, prima
      ancora che la pagina sia disegnata e senza che l'utente possa dire di no.
      È esattamente il trasferimento che rende necessario un banner di consenso
      (e che un tribunale tedesco ha già giudicato illecito nel 2022).

      Il font è quindi impacchettato nel sito, via @fontsource/inter, e
      importato in src/main.jsx. Il risultato è che il sito non fa NESSUNA
      chiamata a terzi prima del login: da qui la scelta di non mettere un
      banner cookie ma solo l'informativa. Vedi /privacy e /cookie.
    -->

    <!--
      Il video dell'intro parte appena la Intro monta: dargli un hint qui
      guadagna qualche centinaio di ms sulla prima visita, che è esattamente
      l'unica visita in cui l'intro viene mostrata.
    -->
    <link rel="preload" as="image" href="./hero-poster.jpg" />
